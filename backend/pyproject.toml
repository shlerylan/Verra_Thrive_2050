[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thrive-2050-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115.12,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2.6,<4", "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1", "defusedxml>=0.7.1,<1"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
